name: Android Build

on:
  workflow_dispatch:
  push:
    branches: ["phonepilot-gemini-agent"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 17 preview SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=1 "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build source marker
        run: echo "Phone Pilot 2.0 final Gemini SDK compile check"

      - name: Show source revision
        run: git rev-parse HEAD

      - name: Build debug APK
        working-directory: PhonePilotGemini
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhonePilot-debug-apk
          path: PhonePilotGemini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
